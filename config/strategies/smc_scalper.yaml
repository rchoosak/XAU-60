# SMC Scalper Strategy Configuration

name: "SMC Scalper"
enabled: true
description: "Smart Money Concepts scalping with CHoCH, FVG, and Order Blocks"

symbols:
  - XAUUSD

timeframe: S1
magic_number: 789123

parameters:
  # CHoCH Detection
  choch_lookback: 10        # 50

  # Fair Value Gap
  fvg_min_pips: 1.0         # 5.0
  fvg_lookback: 20          # 20

  # Order Block
  ob_lookback: 20           # 20

  # Trade Management
  risk_reward: 2.0          # 2.0
  trailing_stop: false
  trailing_pips: 20.0       # 20.0

  # Stop Loss
  use_atr_sl: true
  atr_period: 14
  atr_multiplier: 1.5
  stop_loss_pips: 100.0  # Fallback if ATR not available

risk:
  max_risk_percent: 2.0
  lot_size: 0

session:
  use_time_filter: false
  timezone: "UTC"
  data_timezone: "UTC"
  start_hour: 12
  end_hour: 22
  trade_friday: true

debug:
  enabled: true
  log_every_n_bars: 1
  include_pass_logs: false

alerts:
  telegram: true
  discord: true
