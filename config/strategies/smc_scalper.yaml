# SMC Scalper Strategy Configuration

name: "SMC Scalper"
enabled: false
description: "Smart Money Concepts scalping with trend-aligned short filter and session risk controls"

symbols:
  - XAUUSD

timeframe: M1
magic_number: 789123

parameters:
  # CHoCH Detection
  choch_lookback: 30        # 50

  # Fair Value Gap
  fvg_min_pips: 1.0         # 5.0
  fvg_lookback: 20          # 20

  # Order Block
  ob_lookback: 20           # 20

  # Trade Management
  # risk_reward: 2.5          # Increase TP distance relative to SL
  # trailing_stop: false
  # trailing_pips: 20.0       # Backward-compatible fixed trailing distance
  # trailing_start_pips: 0.0  # Start trailing only after this floating profit (pips)
  # trailing_pips_wide: 200.0 # Stage 1: wider trailing distance
  # tighten_after_profit_pips: 500.0  # Switch to tight trailing after profit reaches this level
  # trailing_pips_tight: 80.0 # Stage 2: tighter trailing distance

  risk_reward: 2.5          # Increase TP distance relative to SL
  trailing_stop: false
  trailing_pips: 80.0       # Backward-compatible fixed trailing distance
  trailing_start_pips: 100.0  # Start trailing only after this floating profit (pips)
  trailing_pips_wide: 200.0 # Stage 1: wider trailing distance
  tighten_after_profit_pips: 500.0  # S switch to tight trailing after profit reaches this level
  trailing_pips_tight: 80.0 # Stage 2: tighter trailing distance

  # Trend Alignment Filter
  trend_filter_enabled: true
  trend_ema_period: 200
  trend_slope_lookback: 20
  trend_min_slope_pips: 1.5
  require_trend_for_buy: false
  require_trend_for_sell: true

  # Early Exit on Strategy Change (close before SL when thesis invalidates)
  early_exit_on_strategy_change: false
  early_exit_min_bars_in_trade: 1
  early_exit_only_when_adverse: false
  early_exit_loss_ratio: 0.70        # close when loss reaches 30% of SL distance
  early_exit_near_sl_ratio: 0.30     # fallback threshold near SL
  early_exit_on_opposite_choch: false
  early_exit_on_trend_flip: false
  early_exit_on_session_invalid: false

  # Stop Loss
  use_atr_sl: false         # ATR SL on M1 was too tight in live
  atr_period: 14
  atr_multiplier: 1.5
  stop_loss_pips: 150.0     # 150 pips = 15.0 XAU price (point=0.01)

risk:
  max_risk_percent: 0.5
  lot_size: 0               # 0 = use global risk.lot_size from settings/.env. Force fixed lot to avoid 100.0 volume spikes
  capital_base: 0.0         # 0 = use global risk.capital_base from settings/.env

session:
  use_time_filter: false
  timezone: "Asia/Bangkok"
  data_timezone: "UTC"
  start_hour: 11
  end_hour: 20
  trade_friday: false

debug:
  enabled: false
  log_every_n_bars: 25
  include_pass_logs: false

decision_logging:
  enabled: true
  log_passed: true
  log_blocked: true
  log_no_signal: false
  log_executor_rejected: true

execution_filters:
  enabled: false
  allow_long: true
  allow_short: true
  blocked_hours: []          # ex: [0, 1, "13-15"]
  blocked_weekdays: []       # ex: [mon, tue] or [0, 1]
  max_spread_points: 0       # 0 = disabled
  cooldown_bars_after_loss: 2
  max_consecutive_losses: 3

# Core multi-timeframe trend bias gate (override global settings.yaml/.env)
trend_bias_filter:
  enabled: true
  timeframes_count: 4
  timeframe_ladder: [M1, M5, M15, M30, H1, H2, H4, D1, W1]
  lookback_bars: 250
  ema_fast_period: 50
  ema_slow_period: 200
  slope_lookback: 5
  min_slope_pips: 0.0
  up_score_threshold: 0.5
  down_score_threshold: 0.5

alerts:
  telegram: true
  discord: true
