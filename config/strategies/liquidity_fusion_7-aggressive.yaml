name: "Liquidity Fusion 7"
version: "1.0.0-aggressive"
enabled: false
description: "Aggressive profile: more frequent entries and relaxed confirmation"

symbols:
  - XAUUSD

timeframe: M1
magic_number: 789888

parameters:
  lookback: 30
  sweep_buffer_pips: 4.0
  sweep_reclaim_ratio: 0.20
  choch_lookback: 50
  fvg_lookback: 30
  ob_lookback: 30
  bos_lookback: 20

  atr_period: 14
  rsi_period: 14
  ema_fast_period: 9
  ema_slow_period: 21
  momentum_rsi_buy_min: 48.0
  momentum_rsi_sell_max: 52.0
  displacement_atr_min: 0.45

  footprint_wick_ratio_min: 0.25
  footprint_range_atr_min: 0.6
  footprint_volume_multiplier: 1.0
  enable_volume_footprint: true

  min_score: 4.0
  cooldown_bars: 1
  max_signals_per_day: 40
  risk_reward: 1.6

  weights:
    liquidity_sweep: 2.0
    order_block: 1.0
    bos_choch: 1.5
    fvg: 1.0
    session: 1.0
    momentum: 1.5
    algo_footprint: 1.0

risk:
  stop_loss_atr_multiplier: 1.3
  stop_loss_min_pips: 80.0
  stop_loss_max_pips: 400.0
  take_profit_min_pips: 80.0
  trailing_stop: true
  trailing_pips: 70.0       # Backward-compatible fixed trailing distance
  trailing_start_pips: 0.0
  trailing_pips_wide: 100.0
  tighten_after_profit_pips: 250.0
  trailing_pips_tight: 45.0
  max_risk_percent: 1.2
  lot_size: 0

session:
  use_time_filter: true
  timezone: "UTC"
  data_timezone: "UTC"
  start_hour: 0
  end_hour: 23
  trade_friday: true

alerts:
  telegram: true
  discord: true
