name: "Edge Rejection Micro Scalping"
enabled: true
description: "Range-edge liquidity sweep rejection micro scalping for XAUUSD"
symbols:
  - XAUUSD
timeframe: M1
magic_number: 791111

parameters:
  atr_period: 14
  atr_baseline_window: 80
  atr_compression_threshold: 1.00
  adx_period: 14
  adx_max_sideway: 24.0
  slope_ema_period: 55
  slope_lookback: 12
  slope_max_atr_multiple: 0.45
  overlap_lookback: 18
  overlap_min_ratio: 0.40
  expansion_bar_multiple: 1.8
  expansion_ratio_max: 0.35
  regime_score_min: 55.0
  regime_filter_enabled: true

  range_lookback: 60
  min_range_width_pips: 45.0
  max_range_width_pips: 420.0
  touch_tolerance_pips: 18.0
  min_touches_per_side: 1
  max_mid_drift_ratio: 0.40
  range_filter_enabled: true

  edge_zone_percent: 0.24
  center_exclusion_percent: 0.20
  min_distance_from_mid_pips: 20.0

  sweep_threshold_pips: 5.0
  sweep_threshold_pips_buy: 4.5
  sweep_threshold_pips_sell: 5.5
  close_inside_buffer_pips: 2.0
  close_inside_buffer_pips_buy: 1.5
  close_inside_buffer_pips_sell: 2.5
  rejection_wick_ratio_min: 0.65
  rejection_wick_ratio_min_buy: 0.55
  rejection_wick_ratio_min_sell: 0.75
  require_close_back_inside: true
  rejection_score_min: 0.90
  rejection_score_min_buy: 0.85
  rejection_score_min_sell: 1.00
  next_bar_failure_required: false
  momentum_rsi_period: 14
  momentum_fail_buy_max_rsi: 58.0
  momentum_fail_sell_min_rsi: 42.0

  micro_structure_lookback: 4
  micro_break_buffer_pips: 1.0
  allow_engulfing_confirmation: true
  require_structure_break: false

risk:
  lot_size: 0.01
  stop_buffer_atr_mult: 0.18
  stop_buffer_min_pips: 6.0
  min_stop_pips: 20.0
  max_stop_pips: 120.0
  midpoint_tp_enabled: true
  midpoint_min_reward_r: 0.20
  fixed_rr_target: 0.90
  opposite_edge_front_run_pips: 12.0
  partial_tp_ratio: 0.50
  move_to_breakeven_after_partial: true
  breakeven_buffer_pips: 3.0
  trailing_stop: true
  trailing_start_pips: 30.0
  trailing_pips: 30.0
  max_bars_in_trade: 12
  no_progress_bar_count: 4
  no_progress_min_mfe_pips: 6.0
  invalidate_on_regime_break: false
  flatten_on_regime_invalidation: false
  invalidate_atr_jump_multiple: 1.35
  invalidate_adx_threshold: 28.0
  one_active_position_only: true
  max_trades_per_range: 2
  cooldown_bars_after_stop: 8
  cooldown_bars_after_force_exit: 3
  duplicate_sweep_block_bars: 20
  spread_threshold_points: 40.0
  max_daily_signals: 30

session:
  use_time_filter: true
  timezone: UTC
  data_timezone: UTC
  start_hour: 6
  end_hour: 23
  long_allowed_hours: ["7-22"]
  short_allowed_hours: ["7-22"]
  trade_friday: true

execution_filters:
  enabled: true
  allow_long: true
  allow_short: true
  blocked_hours: []
  blocked_weekdays: []

diagnostics:
  enabled: true
  level: DEBUG
  state_stale_prune_bars: 4
