name: "AI Multi Timeframe Decision"
version: "1.0.0"
enabled: false
description: "AI strategy that classifies action into buy/hold/sell-out/buy-add from multi-timeframe context"

symbols:
  - XAUUSD

timeframe: M1
magic_number: 796000

ai:
  # openai_compatible: OpenAI, LM Studio (OpenAI mode), OpenRouter-compatible endpoints
  # ollama: local Ollama /api/chat
  provider: openai_compatible
  base_url: "http://192.168.1.127:1234/v1"
  model: "phi-2-mlx"
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 6
  temperature: 0.1
  max_tokens: 80

parameters:
  analysis_timeframes: [M1, M5, M15, H1, H4]
  bars_per_timeframe: 120
  prompt_recent_bars: 20
  close_signal_ttl_seconds: 120
  min_bars_required: 80
  allow_buy_when_already_long: false
  allow_add_without_position: false
  map_buy_add_to_enter_when_flat: true
  min_request_interval_seconds: 0.5
  max_response_latency_seconds: 8.0
  error_backoff_seconds: 3.0

risk:
  lot_size: 0.0
  stop_loss_pips: 120.0
  take_profit_pips: 240.0
