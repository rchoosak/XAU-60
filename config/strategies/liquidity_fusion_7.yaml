name: "Liquidity Fusion 7"
version: "1.0.0"
enabled: false
description: "Hybrid strategy combining sweep/OB/BOS-CHOCH/FVG/session/momentum/algo-footprint"

symbols:
  - XAUUSD

timeframe: M1
magic_number: 789888

parameters:
  lookback: 30
  sweep_buffer_pips: 5.0
  sweep_reclaim_ratio: 0.25
  choch_lookback: 50
  fvg_lookback: 30
  ob_lookback: 30
  bos_lookback: 20

  atr_period: 14
  rsi_period: 14
  ema_fast_period: 9
  ema_slow_period: 21
  momentum_rsi_buy_min: 50.0
  momentum_rsi_sell_max: 50.0
  displacement_atr_min: 0.6

  footprint_wick_ratio_min: 0.35
  footprint_range_atr_min: 0.8
  footprint_volume_multiplier: 1.1
  enable_volume_footprint: true

  min_score: 5.0
  cooldown_bars: 1
  max_signals_per_day: 20
  risk_reward: 1.8

  weights:
    liquidity_sweep: 2.0
    order_block: 1.0
    bos_choch: 1.5
    fvg: 1.0
    session: 1.0
    momentum: 1.5
    algo_footprint: 1.0

risk:
  stop_loss_atr_multiplier: 1.5
  stop_loss_min_pips: 80.0
  stop_loss_max_pips: 400.0
  take_profit_min_pips: 100.0
  trailing_stop: true
  trailing_pips: 80.0       # Backward-compatible fixed trailing distance
  trailing_start_pips: 0.0
  trailing_pips_wide: 120.0
  tighten_after_profit_pips: 300.0
  trailing_pips_tight: 50.0
  max_risk_percent: 0.8
  lot_size: 0

session:
  use_time_filter: true
  timezone: "UTC"
  data_timezone: "UTC"
  start_hour: 7
  end_hour: 20
  trade_friday: true

alerts:
  telegram: true
  discord: true
