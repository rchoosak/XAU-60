# Backtest configuration (live-like)
# Runs the real TradingBot loop using historical data replay.

settings_path: config/settings.yaml

symbol: XAUUSD
timeframe: M1
warmup: 200

journal:
  path: logs/trade_journal.jsonl
  reset_on_start: false

data:
  path: data/backtest-db/xauusd-m1-bid-2020-01-01-2026-03-24.parquet
  start: "2026-01-01"
  end: "2026-03-24"

# Optional override strategy selection.
# If omitted, runner uses each strategy's `enabled` flag from config/strategies/*.yaml.
# execution:
#   strategy: smc_scalper
#   # strategies: [smc_scalper, bollinger_reversion]

simulation:
  initial_balance: 20000.0
  leverage: 100
  point: 0.01
  digits: 2
  contract_size: 100.0
  spread_points: 25.0
  tick_size: 0.01
  tick_value: 1.0
  min_lot: 0.01
  max_lot: 100.0
  lot_step: 0.01
  stop_priority: sl_first   # sl_first | tp_first
  close_open_positions_at_end: true

tui:
  enabled: true
  steps_per_tick: 20
  update_interval: 0.05

performance:
  fast_mode: false
  quiet: false
  disable_journal: false
